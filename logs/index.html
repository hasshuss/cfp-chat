<!DOCTYPE html><html lang="fr"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><title>CFP — Logs conversations</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}:root{--green-dark: #1b4332;--green: #2d6a4f;--green-mid: #40916c;--accent: #8dc63f;--bg: #f3f5f3;--surface: #ffffff;--border: #e8ece8;--text: #111827;--muted: #6b7280;--font: "Inter", system-ui, sans-serif;--shadow: 0 1px 3px rgba(0,0,0,.07), 0 2px 8px rgba(0,0,0,.05);--shadow-md: 0 4px 20px rgba(0,0,0,.1)}html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}.hidden{display:none!important}.login-screen{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green-dark) 0%,#2d6a4f 50%,#1a3a2a 100%);overflow:hidden}.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(141,198,63,.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(255,255,255,.05) 0%,transparent 50%)}.login-card{position:relative;z-index:1;background:var(--surface);border-radius:20px;padding:44px 40px;width:min(400px,calc(100vw - 32px));box-shadow:0 24px 64px #00000040;display:flex;flex-direction:column;gap:20px;align-items:center}.login-logo{width:60px;height:60px;background:linear-gradient(135deg,var(--green-mid),var(--green-dark));border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px #2d6a4f59}.login-logo svg{width:28px;height:28px}.login-head{text-align:center}.login-head h1{font-size:22px;font-weight:700;letter-spacing:-.02em}.login-head p{font-size:13px;color:var(--muted);margin-top:4px}.field-wrap{width:100%;display:flex;flex-direction:column;gap:6px}.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.field-input{height:48px;border:1.5px solid var(--border);border-radius:12px;padding:0 16px;font-size:15px;font-family:var(--font);outline:none;width:100%;transition:border-color .2s,box-shadow .2s;background:#fafafa}.field-input:focus{border-color:var(--green-mid);box-shadow:0 0 0 3px #40916c1f;background:#fff}.btn-login{width:100%;height:50px;background:linear-gradient(135deg,var(--green-mid),var(--green-dark));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;box-shadow:0 4px 16px #2d6a4f59;transition:transform .15s,box-shadow .15s}.btn-login:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px #2d6a4f73}.btn-login:disabled{opacity:.6;cursor:not-allowed}.login-error{font-size:13px;color:#cf1322;min-height:16px;text-align:center}.dashboard{display:flex;height:100vh;overflow:hidden}.sidebar{width:300px;min-width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}.sidebar-top{padding:18px 16px;background:linear-gradient(135deg,var(--green-dark),var(--green));display:flex;align-items:center;justify-content:space-between}.sidebar-brand{display:flex;align-items:center;gap:10px}.sidebar-icon{width:36px;height:36px;background:#ffffff26;border-radius:10px;display:flex;align-items:center;justify-content:center}.sidebar-icon svg{width:18px;height:18px}.sidebar-brand-name{font-size:14px;font-weight:700;color:#fff}.sidebar-brand-sub{font-size:11px;color:#fff9;margin-top:1px}.logout-btn{width:32px;height:32px;background:#ffffff1a;border:1px solid rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#ffffffb3;transition:background .2s}.logout-btn:hover{background:#fff3}.logout-btn svg{width:15px;height:15px}.sidebar-list{flex:1;overflow-y:auto}.conv-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}.conv-item:hover{background:#f5f8f5}.conv-item.active{background:#edf5ef;border-left:3px solid var(--green-mid);padding-left:13px}.conv-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.conv-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}.conv-badge.whatsapp{background:#e6f9ee;color:#1a7a4a}.conv-badge.voice{background:#e8effe;color:#1e4fd6}.conv-date{font-size:11px;color:var(--muted)}.conv-preview{font-size:13px;color:var(--text);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}.conv-count{font-size:11px;color:var(--muted);font-weight:500}.detail-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}.empty-icon{width:64px;height:64px;background:var(--border);border-radius:18px;display:flex;align-items:center;justify-content:center}.empty-icon svg{width:30px;height:30px}.empty-state p{font-size:14px;font-weight:500}.conv-detail{display:flex;flex-direction:column;height:100%}.detail-topbar{padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 1px 4px #0000000a}.detail-session{font-size:12px;color:var(--green);display:block;margin-bottom:3px}.detail-meta{font-size:12px;color:var(--muted)}.messages-list{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}.msg-row{display:flex;align-items:flex-end;gap:8px}.msg-row.user{flex-direction:row-reverse}.msg-row.bot{flex-direction:row}.msg-avatar{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--green-mid),var(--green-dark));display:flex;align-items:center;justify-content:center;flex-shrink:0}.msg-avatar svg{width:14px;height:14px}.msg-bubble{max-width:min(68%,500px);padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5}.msg-row.user .msg-bubble{background:linear-gradient(135deg,var(--green-mid),var(--green-dark));color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 10px #2d6a4f40}.msg-row.bot .msg-bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:var(--shadow)}.msg-role{display:block;font-size:10.5px;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}.msg-row.user .msg-role{color:#ffffffa6}.msg-row.bot .msg-role{color:var(--muted)}.msg-text{white-space:pre-wrap;word-break:break-word}.state-msg{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}.state-msg.error{color:#cf1322}@media(max-width:640px){.dashboard{flex-direction:column}.sidebar{width:100%;height:42vh;min-width:unset;border-right:none;border-bottom:1px solid var(--border)}.detail-panel{height:58vh}.msg-bubble{max-width:88%}.messages-list{padding:14px}.login-card{padding:32px 24px}}
</style></head> <body> <!-- ── Login ── --> <div class="login-screen" id="loginScreen"> <div class="login-bg"></div> <div class="login-card"> <div class="login-logo"> <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path> </svg> </div> <div class="login-head"> <h1>Logs conversations</h1> <p>CFP Distribution · Accès restreint</p> </div> <div class="field-wrap"> <label class="field-label">Token d'accès</label> <input type="password" id="tokenInput" class="field-input" placeholder="••••••••••••" autocomplete="off"> </div> <button class="btn-login" id="loginBtn"> <span id="loginLabel">Accéder au tableau de bord</span> </button> <p class="login-error" id="loginError"></p> </div> </div> <!-- ── Dashboard ── --> <div class="dashboard hidden" id="dashboard"> <aside class="sidebar"> <div class="sidebar-top"> <div class="sidebar-brand"> <div class="sidebar-icon"> <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path> </svg> </div> <div> <div class="sidebar-brand-name">CFP Logs</div> <div class="sidebar-brand-sub"><span id="convCount">—</span> conversations</div> </div> </div> <button class="logout-btn" id="logoutBtn" title="Se déconnecter"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line> </svg> </button> </div> <div class="sidebar-list" id="convList"> <div class="state-msg">Chargement…</div> </div> </aside> <main class="detail-panel"> <div class="empty-state" id="emptyState"> <div class="empty-icon"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path> </svg> </div> <p>Sélectionnez une conversation</p> </div> <div class="conv-detail hidden" id="convDetail"> <div class="detail-topbar"> <div class="detail-info"> <code class="detail-session" id="detailSession"></code> <span class="detail-meta" id="detailMeta"></span> </div> </div> <div class="messages-list" id="messagesList"></div> </div> </main> </div> <script type="module">const d="https://back.poktools.com/api/agent";let s="";const m=document.getElementById("loginScreen"),u=document.getElementById("dashboard"),v=document.getElementById("tokenInput"),i=document.getElementById("loginBtn"),r=document.getElementById("loginLabel"),l=document.getElementById("loginError"),E=document.getElementById("logoutBtn"),o=document.getElementById("convList"),I=document.getElementById("convCount"),k=document.getElementById("emptyState"),B=document.getElementById("convDetail"),$=document.getElementById("detailSession"),b=document.getElementById("detailMeta"),c=document.getElementById("messagesList"),g=localStorage.getItem("cfp_logs_token");g&&(s=g,p());v.addEventListener("keydown",t=>{t.key==="Enter"&&h()});i.addEventListener("click",h);E.addEventListener("click",()=>{localStorage.removeItem("cfp_logs_token"),s="",u.classList.add("hidden"),m.classList.remove("hidden")});async function h(){if(s=v.value.trim(),!!s){r.textContent="Vérification…",i.disabled=!0,l.textContent="";try{if(!(await fetch(`${d}/logs?token=${s}`)).ok)throw new Error;localStorage.setItem("cfp_logs_token",s),p()}catch{l.textContent="Token invalide. Accès refusé.",r.textContent="Accéder au tableau de bord",i.disabled=!1}}}function p(){m.classList.add("hidden"),u.classList.remove("hidden"),w()}async function w(){o.innerHTML='<div class="state-msg">Chargement…</div>';try{const e=await(await fetch(`${d}/logs?token=${s}`)).json();I.textContent=e.length,C(e)}catch{o.innerHTML='<div class="state-msg error">Erreur de chargement.</div>'}}function C(t){if(!t.length){o.innerHTML='<div class="state-msg">Aucune conversation.</div>';return}o.innerHTML=t.map(e=>`
      <div class="conv-item" data-sid="${e.sessionId}">
        <div class="conv-top">
          <span class="conv-badge ${e.channel}">${e.channel==="whatsapp"?"💬 Web":"📞 Voix"}</span>
          <span class="conv-date">${y(e.createdAt)}</span>
        </div>
        <div class="conv-preview">${f(e.lastMessage||"—")}</div>
        <div class="conv-count">${e.messageCount} msg</div>
      </div>
    `).join(""),o.querySelectorAll(".conv-item").forEach(e=>{e.addEventListener("click",()=>{o.querySelectorAll(".conv-item").forEach(n=>n.classList.remove("active")),e.classList.add("active"),S(e.dataset.sid)})})}async function S(t){k.classList.add("hidden"),B.classList.remove("hidden"),c.innerHTML='<div class="state-msg">Chargement…</div>';try{const n=await(await fetch(`${d}/logs/${encodeURIComponent(t)}?token=${s}`)).json();x(n)}catch{c.innerHTML='<div class="state-msg error">Erreur.</div>'}}function x(t){$.textContent=t.sessionId;const e=t.history.filter(n=>n.role==="user"||n.role==="assistant");b.textContent=`${t.channel} · ${y(t.createdAt)} · ${e.length} messages`,c.innerHTML=e.map(n=>{const L=typeof n.content=="string"?n.content:JSON.stringify(n.content),a=n.role==="user";return`
        <div class="msg-row ${a?"user":"bot"}">
          ${a?"":'<div class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg></div>'}
          <div class="msg-bubble">
            <span class="msg-role">${a?"Client":"Agent CFP"}</span>
            <p class="msg-text">${f(L)}</p>
          </div>
        </div>`}).join("")}function y(t){return t?new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"—"}function f(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</script> </body></html>

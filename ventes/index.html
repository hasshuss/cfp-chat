<!DOCTYPE html><html lang="fr"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><title>CFP — Ventes</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}:root{--green-dark: #1b4332;--green: #2d6a4f;--green-mid: #40916c;--accent: #8dc63f;--bg: #f3f5f3;--surface: #ffffff;--border: #e8ece8;--text: #111827;--muted: #6b7280;--font: "Inter", system-ui, sans-serif}html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}.hidden{display:none!important}.login-screen{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green-dark) 0%,#2d6a4f 50%,#1a3a2a 100%);overflow:hidden}.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(141,198,63,.15) 0%,transparent 60%)}.login-card{position:relative;z-index:1;background:var(--surface);border-radius:20px;padding:44px 40px;width:min(400px,calc(100vw - 32px));box-shadow:0 24px 64px #00000040;display:flex;flex-direction:column;gap:20px;align-items:center}.login-logo{width:60px;height:60px;background:linear-gradient(135deg,var(--green-mid),var(--green-dark));border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px #2d6a4f59}.login-logo svg{width:28px;height:28px}.login-head{text-align:center}.login-head h1{font-size:22px;font-weight:700}.login-head p{font-size:13px;color:var(--muted);margin-top:4px}.field-wrap{width:100%;display:flex;flex-direction:column;gap:6px}.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.field-input{height:48px;border:1.5px solid var(--border);border-radius:12px;padding:0 16px;font-size:15px;font-family:var(--font);outline:none;width:100%;transition:border-color .2s,box-shadow .2s;background:#fafafa}.field-input:focus{border-color:var(--green-mid);box-shadow:0 0 0 3px #40916c1f;background:#fff}.btn-login{width:100%;height:50px;background:linear-gradient(135deg,var(--green-mid),var(--green-dark));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px #2d6a4f59}.btn-login:hover:not(:disabled){transform:translateY(-1px)}.btn-login:disabled{opacity:.6;cursor:not-allowed}.login-error{font-size:13px;color:#cf1322;min-height:16px;text-align:center}.page{min-height:100vh;display:flex;flex-direction:column}.topbar{background:linear-gradient(135deg,var(--green-dark),var(--green));box-shadow:0 2px 16px #1b43324d;position:sticky;top:0;z-index:10}.topbar-inner{max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar-left{display:flex;align-items:center;gap:12px}.topbar-icon{width:38px;height:38px;background:#ffffff26;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.topbar-icon svg{width:18px;height:18px}.topbar-title{font-size:15px;font-weight:700;color:#fff}.topbar-sub{font-size:11px;color:#fff9;margin-top:1px}.topbar-right{display:flex;align-items:center;gap:10px}.search-input{height:36px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:0 14px;font-size:13px;background:#ffffff1f;color:#fff;font-family:var(--font);outline:none;width:220px;transition:background .2s,width .3s}.search-input::placeholder{color:#ffffff80}.search-input:focus{background:#ffffff38;width:280px}.logout-btn{width:34px;height:34px;background:#ffffff1a;border:1px solid rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fffc;transition:background .2s}.logout-btn:hover{background:#fff3}.logout-btn svg{width:15px;height:15px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 24px;max-width:1400px;margin:0 auto;width:100%}.kpi{background:var(--surface);border-radius:14px;padding:18px 20px;border:1px solid var(--border);box-shadow:0 1px 4px #0000000d}.kpi-val{font-size:26px;font-weight:700;color:var(--green-dark)}.kpi-label{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500}.table-wrap{flex:1;padding:0 24px 32px;max-width:1400px;margin:0 auto;width:100%;overflow-x:auto}.table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px #0000000f;border:1px solid var(--border)}.table thead tr{background:linear-gradient(135deg,var(--green-dark),var(--green))}.table thead th{padding:13px 16px;text-align:left;font-size:11px;font-weight:700;color:#ffffffe6;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}.table tbody tr{border-bottom:1px solid var(--border);transition:background .1s}.table tbody tr:last-child{border-bottom:none}.table tbody tr:hover{background:#f5f8f5}.table tbody td{padding:12px 16px;font-size:13px;vertical-align:middle}.date-cell{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}.client-name{font-weight:600;color:var(--text)}.client-mail{font-size:11px;color:var(--muted);margin-top:2px}.vendor-cell{font-size:12px;color:var(--muted)}.price-cell{font-weight:700;color:var(--green-dark)}.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}.badge.green{background:#e6f9ee;color:#1a7a4a}.badge.gray{background:#f3f3f3;color:#888}.pdf-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;white-space:nowrap;transition:background .2s,transform .1s;box-shadow:0 1px 4px #2d6a4f40}.pdf-btn:hover:not(:disabled){background:var(--green-dark);transform:translateY(-1px)}.pdf-btn:disabled{opacity:.6;cursor:not-allowed}.pdf-btn.done{background:#52b788}.pdf-btn svg{width:13px;height:13px}.no-pdf{color:var(--muted);font-size:12px}.state-cell{text-align:center;padding:32px;color:var(--muted);font-size:14px}.state-cell.error{color:#cf1322}.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:768px){.kpis{grid-template-columns:repeat(2,1fr);padding:14px}.table-wrap{padding:0 14px 24px}.topbar-inner{flex-wrap:wrap}.search-input{width:160px}.search-input:focus{width:200px}}@media(max-width:480px){.kpis{grid-template-columns:1fr 1fr}.login-card{padding:32px 20px}}
</style></head> <body> <!-- ── Login ── --> <div class="login-screen" id="loginScreen"> <div class="login-bg"></div> <div class="login-card"> <div class="login-logo"> <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path> </svg> </div> <div class="login-head"> <h1>Ventes CFP</h1> <p>Accès restreint · Tableau des ventes</p> </div> <div class="field-wrap"> <label class="field-label">Token d'accès</label> <input type="password" id="tokenInput" class="field-input" placeholder="••••••••••••" autocomplete="off"> </div> <button class="btn-login" id="loginBtn"><span id="loginLabel">Accéder</span></button> <p class="login-error" id="loginError"></p> </div> </div> <!-- ── Dashboard ── --> <div class="page hidden" id="page"> <!-- Topbar --> <header class="topbar"> <div class="topbar-inner"> <div class="topbar-left"> <div class="topbar-icon"> <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path> </svg> </div> <div> <div class="topbar-title">Ventes CFP Distribution</div> <div class="topbar-sub" id="statsLine">Chargement…</div> </div> </div> <div class="topbar-right"> <input type="text" id="searchInput" class="search-input" placeholder="Rechercher client, vendeur…"> <button class="logout-btn" id="logoutBtn" title="Se déconnecter"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line> </svg> </button> </div> </div> </header> <!-- KPIs --> <div class="kpis" id="kpis"> <div class="kpi"><div class="kpi-val" id="kpiTotal">—</div><div class="kpi-label">Total ventes</div></div> <div class="kpi"><div class="kpi-val" id="kpiCA">—</div><div class="kpi-label">CA HT total</div></div> <div class="kpi"><div class="kpi-val" id="kpiMoy">—</div><div class="kpi-label">Panier moyen</div></div> <div class="kpi"><div class="kpi-val" id="kpiPdf">—</div><div class="kpi-label">Devis PDF</div></div> </div> <!-- Table --> <div class="table-wrap"> <table class="table" id="table"> <thead> <tr> <th>Date</th> <th>Client</th> <th>Vendeur</th> <th>Total HT</th> <th>TVA</th> <th>Stock</th> <th>PDF</th> </tr> </thead> <tbody id="tableBody"> <tr><td colspan="7" class="state-cell">Chargement…</td></tr> </tbody> </table> </div> </div> <script type="module" src="/cfp-chat/_astro/ventes.astro_astro_type_script_index_0_lang.BHYyRlak.js"></script> </body></html>
